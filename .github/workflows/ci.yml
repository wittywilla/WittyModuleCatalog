name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Commits from Windows lose the executable bit, and a release can't run what's left.
      - name: Scripts are executable in git
        run: |
          bad=$(git ls-files -s -z | while IFS=$'\t' read -r -d '' info f; do
            case "$f" in *.sh) ;; *) head -c2 "$f" 2>/dev/null | grep -qa '^#!' || continue ;; esac
            [ "${info%% *}" = 100755 ] || echo "$f"
          done)
          [ -z "$bad" ] || { echo "Not executable in git. Run git update-index --chmod=+x on:"; echo "$bad"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - run: go run github.com/wittywilla/wittymodule/cmd/wittymodule@v0.4.0 catalog-check catalog.json
      - run: node scripts/make-icons.mjs --check
      # Every version's module API is one a server takes, and API 4 versions fit servers that read sdui.json.
      - run: node scripts/check-api.mjs catalog.json
