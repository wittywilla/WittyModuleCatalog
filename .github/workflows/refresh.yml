# Lists versions that modules have released since the last look. It holds no signing key:
# a release has to be signed already, and publish signs the result.
name: refresh
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Look for new releases
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_PUBLIC_KEY: ${{ vars.MODULE_PUBLIC_KEY }}
        run: scripts/refresh.sh
      - name: Commit what changed
        run: |
          git diff --quiet catalog.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Catalogue: new versions" catalog.json
          git push
